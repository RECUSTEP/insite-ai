name: Deploy API (Wrangler)

on:
  push:
    branches:
      - prd
      - stg

env:
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      # 1) ソースチェックアウト
      - uses: actions/checkout@v4

      # 2) Node.js + pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      # 3) モノレポ全体の依存をインストール
      - run: pnpm install -r

      # 4) apps/api 配下でも依存を補完（hono などがある workspace）
      - run: pnpm --filter apps/api install

      # 5) D1 マイグレーションを実行（デプロイ前に必須）
      - name: Apply D1 Migrations
        run: |
          cd apps/api
          if [ "${{ github.ref_name }}" = "prd" ]; then
            npx wrangler@4 d1 migrations apply database --remote || echo "Migration may have already been applied"
          else
            npx wrangler@4 d1 migrations apply database --remote --env preview || echo "Migration may have already been applied"
          fi
        env:
          CLOUDFLARE_API_TOKEN:   ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ env.CLOUDFLARE_ACCOUNT_ID }}
      
      # 5.5) 最新マイグレーションを個別に適用（冪等性保証）
      - name: Apply Latest Migration - Add Revision Columns & SEO Addon & Project Info
        run: |
          cd apps/api
          run_sql() {
            local CMD="$1"
            local DESC="$2"
            if [ "${{ github.ref_name }}" = "prd" ]; then
              npx wrangler@4 d1 execute database --remote --command "$CMD" || echo "$DESC may already exist"
            else
              npx wrangler@4 d1 execute database --remote --env preview --command "$CMD" || echo "$DESC may already exist"
            fi
          }

          # --- カラム追加（べき等） ---
          run_sql "ALTER TABLE project ADD COLUMN auth_id TEXT;" "auth_id column"
          run_sql "ALTER TABLE analysis_history ADD COLUMN revision_parent_id TEXT;" "revision_parent_id column"
          run_sql "ALTER TABLE analysis_history ADD COLUMN version INTEGER DEFAULT 1 NOT NULL;" "version column"
          run_sql "CREATE INDEX IF NOT EXISTS analysis_history_revision_parent_id_idx ON analysis_history (revision_parent_id);" "Index"
          run_sql "ALTER TABLE project ADD COLUMN seo_addon_enabled INTEGER DEFAULT 0 NOT NULL;" "seo_addon_enabled column"
          run_sql "ALTER TABLE project_info ADD COLUMN store_name text;" "store_name column"
          run_sql "ALTER TABLE project_info ADD COLUMN instagram_template text;" "instagram_template column"
          run_sql "ALTER TABLE project_info ADD COLUMN instagram_keyword1 text;" "instagram_keyword1 column"
          run_sql "ALTER TABLE project_info ADD COLUMN instagram_keyword2 text;" "instagram_keyword2 column"
          run_sql "ALTER TABLE project_info ADD COLUMN instagram_keyword3 text;" "instagram_keyword3 column"
          run_sql "ALTER TABLE auth ADD COLUMN company_name text;" "company_name column"

          # --- テーブル作成（べき等）: announce ---
          run_sql "CREATE TABLE IF NOT EXISTS \`announce\` (\`id\` integer PRIMARY KEY AUTOINCREMENT NOT NULL, \`title\` text NOT NULL, \`content\` text NOT NULL, \`created_at\` integer NOT NULL, \`updated_at\` integer NOT NULL);" "announce table"

          # --- テーブル作成（べき等）: chat_sessions ---
          run_sql "CREATE TABLE IF NOT EXISTS \`chat_sessions\` (\`id\` text PRIMARY KEY NOT NULL, \`project_id\` text NOT NULL, \`title\` text NOT NULL, \`messages\` text NOT NULL, \`created_at\` integer NOT NULL, \`updated_at\` integer NOT NULL, FOREIGN KEY (\`project_id\`) REFERENCES \`project\`(\`project_id\`) ON UPDATE no action ON DELETE cascade);" "chat_sessions table"
          run_sql "CREATE INDEX IF NOT EXISTS \`chat_sessions_project_id_idx\` ON \`chat_sessions\` (\`project_id\`);" "chat_sessions index"
        env:
          CLOUDFLARE_API_TOKEN:   ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      # 6) Wrangler 4 CLI で確実にデプロイ
      - name: Publish Worker via CLI
        run: |
          cd apps/api
          if [ "${{ github.ref_name }}" = "prd" ]; then
            npx wrangler@4 deploy --config wrangler.toml
          else
            npx wrangler@4 deploy --config wrangler.toml --env preview
          fi
        env:
          CLOUDFLARE_API_TOKEN:   ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:  ${{ env.CLOUDFLARE_ACCOUNT_ID }}
